<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }} · Coding Saint</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="icon" href="/assets/images/brand-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem('codingsaint-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="/assets/css/brand.css">
  <script src="/assets/js/brand.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header wrap">
  <a class="wordmark" href="/" aria-label="Coding Saint home">coding<strong>saint</strong><svg class="mark" viewBox="0 0 20 40" aria-hidden="true"><circle cx="11" cy="9" r="5" fill="#C81E3A"/><path d="M6 22h10c0 10-5 15-11 17l-2-5c5-2 6-5 3-12Z" fill="currentColor"/></svg></a>
  <nav aria-label="Main navigation"><a href="/#kb">KB product</a><a href="/courses/">Courses</a><a href="/#vision">Our vision</a></nav>
  <div class="header-actions"><button class="theme-toggle" type="button" aria-label="Switch colour theme" hidden><span aria-hidden="true">◐</span><span class="theme-label">Theme</span></button><a class="button small" href="/kb/">Open KB <span aria-hidden="true">↗</span></a></div>
</header>
<main id="main">{{ content }}</main>
<footer class="wrap site-footer"><div><a class="wordmark" href="/" aria-label="Coding Saint home">coding<strong>saint</strong><svg class="mark" viewBox="0 0 20 40" aria-hidden="true"><circle cx="11" cy="9" r="5" fill="#C81E3A"/><path d="M6 22h10c0 10-5 15-11 17l-2-5c5-2 6-5 3-12Z" fill="currentColor"/></svg></a><p>Simple, short tutorials. Lasting understanding.</p></div><nav aria-label="Footer navigation"><a href="/kb/">KB</a><a href="/courses/">Courses</a><a href="https://www.youtube.com/@codingsaint">YouTube ↗</a><a href="https://github.com/CODINGSAINT">GitHub ↗</a><a href="mailto:codingsaint@gmail.com">Get in touch</a></nav><p class="copyright">© {{ 'now' | date: '%Y' }} Coding Saint</p></footer>
</body>
</html>
